<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#111b21">
<title>Doğukan Sansar — Sohbet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b141a; --bar: #111b21; --in: #1f2c34; --out: #005c4b; --text: #e9edef; --muted: #8696a0;
    --accent: #00a884; --tick: #53bdeb; --chip: #1f2c34; --chip-border: #2a3942;
    --job: #fbbf24; --project: #38bdf8; --skill: #4ade80; --edu: #c084fc;
    --mono: "JetBrains Mono", ui-monospace, monospace; --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); }
  body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
  button, input { font: inherit; color: inherit; }
  a { color: var(--tick); }

  header {
    display: flex; align-items: center; gap: 10px; padding: calc(10px + env(safe-area-inset-top)) 12px 10px;
    background: var(--bar); border-bottom: 1px solid #222d34; flex-shrink: 0;
  }
  .back { width: 32px; height: 32px; display: grid; place-items: center; color: var(--text); text-decoration: none; font-size: 22px; }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center;
    font-weight: 700; font-size: 15px; color: #04130c; background: linear-gradient(135deg, #4ade80, #38bdf8);
    box-shadow: 0 0 0 2px var(--bar), 0 0 0 3.5px var(--accent);
  }
  .who { flex: 1; min-width: 0; }
  .who b { display: block; font-size: 16px; font-weight: 600; }
  .who small { color: var(--muted); font-size: 12.5px; }
  .who small.typing { color: var(--accent); }
  .lang { background: none; border: 1px solid var(--chip-border); border-radius: 8px; padding: 5px 9px; font-family: var(--mono); font-size: 11px; cursor: pointer; }
  .lang b { color: var(--accent); }

  main {
    flex: 1; overflow-y: auto; padding: 14px 10px 8px; overscroll-behavior: contain;
    background-color: var(--bg);
    background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,.035) 1px, transparent 0);
    background-size: 22px 22px;
  }
  .day { text-align: center; margin: 4px 0 14px; }
  .day span { background: #182229; color: var(--muted); font-size: 12px; padding: 5px 12px; border-radius: 8px; }
  .notice { margin: 0 auto 14px; max-width: 320px; text-align: center; background: #182229; color: #ffd279; font-size: 12px; padding: 7px 12px; border-radius: 8px; line-height: 1.45; }

  .msg { display: flex; margin: 2px 0; }
  .msg.out { justify-content: flex-end; }
  .msg + .msg.out, .msg + .msg.in { margin-top: 2px; }
  .msg.in + .msg.out, .msg.out + .msg.in { margin-top: 10px; }
  .bubble {
    position: relative; max-width: 82%; padding: 7px 9px 6px 10px; border-radius: 9px; font-size: 15px; line-height: 1.42;
    background: var(--in); box-shadow: 0 1px 1px rgba(0,0,0,.25); word-wrap: break-word;
    animation: pop .22s ease-out;
  }
  .out .bubble { background: var(--out); }
  .msg.first.in .bubble { border-top-left-radius: 2px; }
  .msg.first.out .bubble { border-top-right-radius: 2px; }
  .bubble .meta { float: right; margin: 6px 0 -3px 10px; font-size: 11px; color: rgba(233,237,239,.6); white-space: nowrap; }
  .bubble .meta .t { color: var(--tick); margin-left: 3px; letter-spacing: -3px; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.98); } }
  .typing-dots { display: inline-flex; gap: 4px; padding: 4px 2px; }
  .typing-dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: bounce 1.2s infinite; }
  .typing-dots i:nth-child(2) { animation-delay: .15s; } .typing-dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: none; opacity: .5; } 30% { transform: translateY(-4px); opacity: 1; } }

  /* Kartlar */
  .card { max-width: 86%; width: 300px; padding: 0; overflow: hidden; }
  .card .head { padding: 11px 12px 4px; }
  .card .kind { font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
  .card .kind i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }
  .card h3 { margin: 6px 0 2px; font-size: 17px; }
  .card .sub { color: var(--muted); font-size: 13px; }
  .card .body { padding: 4px 12px 10px; font-size: 14px; color: #d1d7db; }
  .card ul { margin: 6px 0 0; padding-left: 18px; }
  .card li { margin: 3px 0; }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .tag { font-family: var(--mono); font-size: 11px; padding: 2px 7px; border-radius: 5px; background: rgba(74,222,128,.1); color: var(--skill); }
  .card .actions { display: flex; border-top: 1px solid rgba(255,255,255,.07); }
  .card .actions a, .card .actions button {
    flex: 1; text-align: center; padding: 10px 6px; font-size: 14px; color: var(--tick); background: none; border: 0;
    text-decoration: none; cursor: pointer; font-weight: 500;
  }
  .card .actions > * + * { border-left: 1px solid rgba(255,255,255,.07); }
  .carousel { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 2px 2px 6px; max-width: 100%; scrollbar-width: none; animation: pop .22s ease-out; }
  .carousel::-webkit-scrollbar { display: none; }
  .carousel .bubble { flex: 0 0 240px; scroll-snap-align: start; max-width: none; }
  .group { margin-top: 10px; }
  .group:first-child { margin-top: 2px; }
  .group b { font-family: var(--mono); font-size: 11px; color: var(--project); font-weight: 600; }

  /* Hazır sorular ve giriş */
  footer { background: var(--bar); flex-shrink: 0; padding: 8px 0 calc(8px + env(safe-area-inset-bottom)); }
  .chips { display: flex; gap: 7px; overflow-x: auto; padding: 0 10px 8px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0; padding: 8px 13px; border-radius: 18px; background: var(--chip); border: 1px solid var(--chip-border);
    font-size: 14px; cursor: pointer; white-space: nowrap; transition: background .15s;
  }
  .chip:active { background: #2a3942; }
  .chip:disabled { opacity: .4; }
  .compose { display: flex; gap: 8px; padding: 0 10px; align-items: center; }
  .compose input {
    flex: 1; min-width: 0; background: #2a3942; border: 0; border-radius: 22px; padding: 11px 16px; font-size: 16px; outline: none;
  }
  .compose input::placeholder { color: var(--muted); }
  .send { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--accent); display: grid; place-items: center; cursor: pointer; flex-shrink: 0; }
  .send svg { width: 20px; height: 20px; fill: #fff; margin-left: 2px; }

  @media (min-width: 700px) {
    body { max-width: 480px; margin: 0 auto; border-left: 1px solid #222d34; border-right: 1px solid #222d34; }
  }
  @media (prefers-reduced-motion: reduce) { .bubble, .carousel { animation: none; } .typing-dots i { animation: none; } }
</style>
</head>
<body>
<header>
  <a class="back" href="./" aria-label="Sürümlere dön">‹</a>
  <div class="avatar" aria-hidden="true">DS</div>
  <div class="who"><b id="name"></b><small id="status"></small></div>
  <button class="lang" id="lang"></button>
</header>

<main id="chat" aria-live="polite"></main>

<footer>
  <div class="chips" id="chips"></div>
  <form class="compose" id="compose">
    <input id="input" autocomplete="off" enterkeyhint="send">
    <button class="send" aria-label="Gönder"><svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg></button>
  </form>
</footer>

<script src="../assets/veri.js"></script>
<script>
const UI = {
  tr: {
    online: "çevrimiçi", typing: "yazıyor…", today: "BUGÜN", placeholder: "Mesaj yaz…",
    notice: "🔒 Bu bir otomatik sohbettir. Cevaplar Doğukan'ın özgeçmişinden gelir.",
    hi: ["Merhaba 👋 Ben Doğukan.", "Lise öğrencisiyim ve 2 yılı aşkın süredir junior pentester olarak çalışıyorum.", "Ne merak ediyorsun? Aşağıdan seçebilir ya da yazabilirsin."],
    q: { job: "Ne iş yapıyorsun?", projects: "Projelerin neler?", orbit: "Orbit ne?", lab: "Test labın nasıl?", skills: "Neler biliyorsun?",
         langs: "Hangi dilleri konuşuyorsun?", edu: "Okul?", posts: "CTF & blog yazıların?", contact: "Sana nasıl ulaşırım?", cv: "CV'ni görebilir miyim?" },
    a: {
      job: "ForDefence'ta junior pentester olarak çalışıyorum 👇",
      projects: "Okul ve işin yanında kendi araçlarımı geliştiriyorum. Kaydırarak bakabilirsin 👉",
      skills: "Kısaca şunlar:", langs: (l) => `${l} 🌍`,
      edu: "Hâlâ lise öğrencisiyim 🎒 Okulla birlikte profesyonel olarak siber güvenlik alanında çalışıyorum.",
      postsSome: "Yazdıklarımın hepsi burada 📝", postsNone: "İlk CTF çözümlerim yakında burada olacak ✍️ Şimdilik Orbit'i anlattığım yazıya bakabilirsin.",
      contact: "En hızlısı e-posta. LinkedIn'den de yazabilirsin 🙂",
      cv: "Tabii! İki seçeneğin var 👇", greet: "Selam! 👋 Ne merak ediyorsun?",
      unknown: "Bunu henüz bilmiyorum 🙂 Şunlardan birini sorabilirsin:",
      hire: "🔓 sudo yetkisi verildi. İşe alım süreci başlatılıyor… Bana talhadogukansansar@gmail.com adresinden yazman yeterli 😄",
      orbitMore: "Uzun hâlini burada anlattım:",
    },
    btn: { tell: "Anlat", read: "Yazıyı oku", open: "Aç", mail: "E-posta", classic: "Klasik CV", network: "Ağ görünümü", all: "Tüm yazılar" },
    kinds: { job: "Deneyim", project: "Proje", skill: "Yetenek", edu: "Eğitim" },
  },
  en: {
    online: "online", typing: "typing…", today: "TODAY", placeholder: "Type a message…",
    notice: "🔒 This is an automated chat. Answers come from Doğukan's resume.",
    hi: ["Hi 👋 I'm Doğukan.", "I'm a high school student and have been working as a junior penetration tester for over two years.", "What would you like to know? Pick a question below or type one."],
    q: { job: "What do you do?", projects: "What are your projects?", orbit: "What is Orbit?", lab: "Tell me about your lab", skills: "What do you know?",
         langs: "Which languages do you speak?", edu: "School?", posts: "CTF & blog posts?", contact: "How can I reach you?", cv: "Can I see your CV?" },
    a: {
      job: "I work as a junior penetration tester at ForDefence 👇",
      projects: "Alongside school and work I build my own tools. Swipe through them 👉",
      skills: "In short:", langs: (l) => `${l} 🌍`,
      edu: "I'm still in high school 🎒 Working professionally in cyber security alongside school.",
      postsSome: "Everything I've written is here 📝", postsNone: "My first CTF write-ups are coming soon ✍️ For now you can read the post about Orbit.",
      contact: "Email is fastest. You can also reach me on LinkedIn 🙂",
      cv: "Sure! Two options 👇", greet: "Hey! 👋 What would you like to know?",
      unknown: "I don't know that one yet 🙂 You could ask:",
      hire: "🔓 sudo granted. Starting hiring process… Just email me at talhadogukansansar@gmail.com 😄",
      orbitMore: "I wrote about it in detail here:",
    },
    btn: { tell: "Tell me", read: "Read post", open: "Open", mail: "Email", classic: "Classic CV", network: "Network view", all: "All posts" },
    kinds: { job: "Experience", project: "Project", skill: "Skill", edu: "Education" },
  },
};
const COLORS = { job: "#fbbf24", project: "#38bdf8", skill: "#4ade80", edu: "#c084fc" };
const u = () => UI[lang];
const $ = (id) => document.getElementById(id);
const chat = $("chat");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const sleep = (ms) => new Promise((r) => setTimeout(r, reduced ? 0 : ms));
let posts = [];
let busy = false, run = 0;
const asked = new Set();
let lastSide = null;

const now = () => new Date().toLocaleTimeString(lang === "tr" ? "tr-TR" : "en-GB", { hour: "2-digit", minute: "2-digit" });
const scrollDown = () => chat.scrollTo({ top: chat.scrollHeight, behavior: reduced ? "auto" : "smooth" });

function row(side, el) {
  const m = document.createElement("div");
  m.className = `msg ${side}` + (lastSide !== side ? " first" : "");
  lastSide = side;
  m.append(el);
  chat.append(m);
  scrollDown();
  return m;
}
function bubble(html, side = "in") {
  const b = document.createElement("div");
  b.className = "bubble";
  b.innerHTML = `${html}<span class="meta">${now()}${side === "out" ? '<span class="t">✓✓</span>' : ""}</span>`;
  return row(side, b);
}
async function typing(ms) {
  $("status").textContent = u().typing; $("status").className = "typing";
  const b = document.createElement("div");
  b.className = "bubble";
  b.innerHTML = '<span class="typing-dots"><i></i><i></i><i></i></span>';
  const r = row("in", b);
  await sleep(ms);
  r.remove(); lastSide = chat.lastElementChild && chat.lastElementChild.classList.contains("in") ? "in" : chat.lastElementChild ? "out" : null;
  $("status").textContent = u().online; $("status").className = "";
}
async function say(text, myRun) {
  await typing(Math.min(1500, 450 + text.length * 16));
  if (myRun !== run) throw "cancel";
  bubble(esc(text));
}
async function show(el, myRun, delay = 700) {
  await typing(delay);
  if (myRun !== run) throw "cancel";
  if (el.classList.contains("carousel")) { chat.append(el); lastSide = "in"; scrollDown(); return; }
  row("in", el);
}

function itemCard(x, actions = "") {
  const c = document.createElement("div");
  c.className = "bubble card";
  const pts = T(x.points) || [];
  c.innerHTML = `
    <div class="head">
      <div class="kind" style="color:${COLORS[x.type]}"><i></i>${u().kinds[x.type]}</div>
      <h3>${esc(T(x.title))}</h3>
      ${x.org || x.date ? `<div class="sub">${[T(x.org), T(x.date)].filter(Boolean).map(esc).join(" · ")}</div>` : ""}
    </div>
    <div class="body">
      ${x.desc ? esc(T(x.desc)) : ""}
      ${pts.length ? `<ul>${pts.map((p) => `<li>${esc(p)}</li>`).join("")}</ul>` : ""}
      ${skillsOf(x).length ? `<div class="tags">${skillsOf(x).map((s) => `<span class="tag">${esc(T(s.title))}</span>`).join("")}</div>` : ""}
    </div>
    ${actions ? `<div class="actions">${actions}</div>` : ""}`;
  return c;
}
const linkBtn = (href, label) => `<a href="${esc(href)}"${/^https?:/.test(href) ? ' target="_blank" rel="noopener"' : ""}>${label}</a>`;

/* ---- Konular ---- */
const TOPICS = {
  async job(r) {
    await say(u().a.job, r);
    await show(itemCard(byId.fordefence), r);
    return ["lab", "skills", "projects"];
  },
  async projects(r) {
    await say(u().a.projects, r);
    const car = document.createElement("div");
    car.className = "carousel";
    for (const p of ofType("project")) {
      const c = itemCard(p, `<button data-ask="p:${p.id}">${u().btn.tell}</button>`);
      c.querySelector(".body").innerHTML = `${esc(T(p.desc)).slice(0, 110)}…`;
      car.append(c);
    }
    await show(car, r);
    return ["orbit", "lab", "posts"];
  },
  async orbit(r) { return TOPICS["p:orbit"](r); },
  async lab(r) { return TOPICS["p:testlab"](r); },
  async skills(r) {
    await say(u().a.skills, r);
    const c = document.createElement("div");
    c.className = "bubble card";
    const groups = {};
    ofType("skill").forEach((s) => (groups[s.group] = groups[s.group] || []).push(s));
    c.innerHTML = `<div class="body" style="padding-top:12px">${Object.entries(groups).map(([g, list]) =>
      `<div class="group"><b>// ${esc(T(SKILL_GROUPS[g]))}</b><div class="tags">${list.map((s) => `<span class="tag">${esc(T(s.title))}</span>`).join("")}</div></div>`).join("")}</div>`;
    await show(c, r);
    return ["langs", "projects", "contact"];
  },
  async langs(r) { await say(u().a.langs(T(PROFILE.languages)), r); return ["edu", "contact"]; },
  async edu(r) { await say(u().a.edu, r); return ["job", "projects"]; },
  async posts(r) {
    if (!posts.length) {
      await say(u().a.postsNone, r);
      await show(itemCard(byId.orbit, linkBtn("../yazi.html?y=orbit", u().btn.read)), r);
      return ["contact", "projects"];
    }
    await say(u().a.postsSome, r);
    const car = document.createElement("div");
    car.className = "carousel";
    for (const p of posts.slice(0, 6)) {
      const c = document.createElement("div");
      c.className = "bubble card";
      c.innerHTML = `<div class="head"><div class="kind" style="color:${p.tur === "ctf" ? "#f87171" : "#38bdf8"}"><i></i>${p.tur === "ctf" ? "CTF" : "Blog"} · ${esc(p.tarih)}</div><h3>${esc(p.baslik)}</h3></div>
        <div class="body">${esc(p.ozet)}</div><div class="actions">${linkBtn("../yazi.html?y=" + encodeURIComponent(p.slug), u().btn.read)}</div>`;
      car.append(c);
    }
    await show(car, r);
    return ["contact", "projects"];
  },
  async contact(r) {
    await say(u().a.contact, r);
    const c = document.createElement("div");
    c.className = "bubble card";
    c.innerHTML = `<div class="head"><h3>${esc(PROFILE.name)}</h3><div class="sub">${esc(PROFILE.email)}</div></div>
      <div class="actions">${linkBtn("mailto:" + PROFILE.email, u().btn.mail)}${PROFILE.socials.map((s) => linkBtn(s.url, s.label)).join("")}</div>`;
    await show(c, r, 500);
    return ["cv", "posts"];
  },
  async cv(r) {
    await say(u().a.cv, r);
    const c = document.createElement("div");
    c.className = "bubble card";
    c.innerHTML = `<div class="head"><h3>${esc(PROFILE.name)}</h3><div class="sub">${esc(T(PROFILE.role))}</div></div>
      <div class="actions">${linkBtn("../klasik.html", u().btn.classic)}${linkBtn("../index.html", u().btn.network)}</div>`;
    await show(c, r, 500);
    return ["contact"];
  },
  async greet(r) { await say(u().a.greet, r); return null; },
  async hire(r) { await say(u().a.hire, r); return ["contact"]; },
};
for (const p of ofType("project")) {
  TOPICS["p:" + p.id] = async (r) => {
    await say(T(p.desc), r);
    const acts = p.url ? linkBtn(rootUrl(p.url), p.id === "orbit" ? u().btn.read : u().btn.open) : "";
    await show(itemCard({ ...p, desc: "" }, acts), r, 500);
    if (p.id === "orbit") return ["lab", "skills", "contact"];
    return ["orbit", "projects", "contact"];
  };
}

const ORDER = ["job", "projects", "orbit", "lab", "skills", "posts", "contact", "langs", "edu", "cv"];
const label = (k) => k.startsWith("p:") ? `${T(byId[k.slice(2)].title)}?` : u().q[k];

function renderChips(suggest) {
  const rest = ORDER.filter((k) => !asked.has(k));
  const list = [...new Set([...(suggest || []).filter((k) => !asked.has(k)), ...rest])];
  const final = list.length ? list : ORDER;
  $("chips").innerHTML = final.map((k) => `<button class="chip" data-ask="${k}">${esc(label(k))}</button>`).join("");
  $("chips").scrollLeft = 0;
}

async function ask(key, text) {
  if (busy) return;
  busy = true;
  document.querySelectorAll(".chip").forEach((c) => (c.disabled = true));
  bubble(esc(text ?? label(key)), "out");
  asked.add(key);
  const SAME = { orbit: "p:orbit", "p:orbit": "orbit", lab: "p:testlab", "p:testlab": "lab" };
  if (SAME[key]) asked.add(SAME[key]);
  const r = run;
  let next = null;
  try { await sleep(350); next = await TOPICS[key](r); } catch (e) { if (e !== "cancel") throw e; }
  if (r !== run) return;
  busy = false;
  renderChips(next);
}

/* ---- Serbest yazı: anahtar kelimelerle konu bulma ---- */
const KEYWORDS = [
  [/sudo|hire|işe al|ise al/i, "hire"],
  [/orbit|asistan|assistant/i, "orbit"],
  [/\blab|laboratuvar|active directory|\bad\b/i, "lab"],
  [/xss/i, "p:xsslab"],
  [/proje|project|ne yaptın|yaptıkların/i, "projects"],
  [/ctf|blog|yazı|post|write ?up|writeup/i, "posts"],
  [/iletişim|ulaş|mail|e-posta|linkedin|github|contact|reach/i, "contact"],
  [/\bcv\b|özgeçmiş|resume/i, "cv"],
  [/yetenek|beceri|bil|skill|know|teknoloji|stack/i, "skills"],
  [/dil|ingilizce|almanca|language|english|german/i, "langs"],
  [/okul|lise|eğitim|school|educat|kaç yaş|age/i, "edu"],
  [/iş|çalış|meslek|pentest|job|work|do you do|fordefence/i, "job"],
  [/^(merhaba|selam|sa|hey|hi|hello|naber)\b/i, "greet"],
];
$("compose").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = $("input").value.trim();
  if (!text || busy) return;
  $("input").value = "";
  const hit = KEYWORDS.find(([re]) => re.test(text));
  if (hit) return ask(hit[1], text);
  busy = true;
  bubble(esc(text), "out");
  const r = run;
  try { await say(u().a.unknown, r); } catch (err) { return; }
  busy = false;
  renderChips();
});

document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-ask]");
  if (b) ask(b.dataset.ask);
});

async function start() {
  run++; busy = true; asked.clear(); lastSide = null;
  document.documentElement.lang = lang;
  $("name").textContent = PROFILE.name;
  $("status").textContent = u().online; $("status").className = "";
  $("lang").innerHTML = lang === "tr" ? "<b>TR</b>/EN" : "TR/<b>EN</b>";
  $("input").placeholder = u().placeholder;
  chat.innerHTML = `<div class="day"><span>${u().today}</span></div><div class="notice">${u().notice}</div>`;
  $("chips").innerHTML = "";
  const r = run;
  try {
    await sleep(500);
    for (const line of u().hi) await say(line, r);
  } catch (e) { return; }
  busy = false;
  renderChips();
}
$("lang").onclick = () => { setLang(lang === "tr" ? "en" : "tr"); start(); };

loadPosts().then((p) => (posts = p));
start();
</script>
</body>
</html>
