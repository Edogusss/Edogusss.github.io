<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1322">
<title>Doğukan Sansar — Ağ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a1322; --card: rgba(19,34,58,.92); --border: rgba(255,255,255,.09); --text: #f0e8dc; --muted: #9aa5b8;
    --job: #f28c38; --project: #4f8fe6; --skill: #e6bf8a; --edu: #c98b5e;
    --mono: "JetBrains Mono", ui-monospace, monospace; --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --stage: 44vh;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body { margin: 0; color: var(--text); font-family: var(--sans); background: var(--bg); max-width: 560px; margin: 0 auto; }
  button { font: inherit; color: inherit; }
  a { color: var(--project); }

  .stage { position: sticky; top: 0; height: var(--stage); z-index: 2; background: var(--bg); border-bottom: 1px solid var(--border); overflow: hidden; }
  .stage::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 30px; background: linear-gradient(transparent, rgba(10,19,34,.8)); pointer-events: none; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: pan-y; }
  .bar { position: absolute; z-index: 3; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 8px; padding: calc(10px + env(safe-area-inset-top)) 12px 0; }
  .bar a.back { width: 32px; height: 32px; display: grid; place-items: center; font-size: 22px; color: var(--text); text-decoration: none; }
  .bar .sp { flex: 1; }
  .lang { font-family: var(--mono); font-size: 11px; border: 1px solid var(--border); background: rgba(10,19,34,.6); border-radius: 7px; padding: 5px 9px; cursor: pointer; }
  .lang b { color: var(--skill); }
  .year { position: absolute; z-index: 3; left: 16px; bottom: 12px; font-family: var(--mono); font-weight: 700; font-size: 34px; letter-spacing: -0.03em; line-height: 1; }
  .year small { display: block; font-size: 10px; font-weight: 400; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 3px; }
  .counts { position: absolute; z-index: 3; right: 14px; bottom: 14px; display: flex; gap: 10px; font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .counts span { display: inline-flex; align-items: center; gap: 5px; }
  .counts i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }

  main { position: relative; z-index: 1; padding: 0 16px calc(40px + env(safe-area-inset-bottom)); }
  .intro { padding: 28px 2px 10px; }
  .intro .hello { font-family: var(--mono); font-size: 12px; color: var(--job); }
  .intro h1 { font-size: 36px; letter-spacing: -0.03em; margin: 6px 0 4px; line-height: 1.05; }
  .intro .role { color: var(--muted); }
  .intro p { color: #d6cfc4; line-height: 1.6; }
  .scroll-hint { font-family: var(--mono); font-size: 12px; color: var(--muted); margin: 18px 0 30px; display: flex; align-items: center; gap: 8px; }
  .scroll-hint i { display: inline-block; animation: nudge 1.6s infinite; }
  @keyframes nudge { 50% { transform: translateY(5px); } }

  .yr { padding-top: 20px; }
  .yr-label { position: sticky; top: calc(var(--stage) + 8px); z-index: 1; display: inline-block; font-family: var(--mono); font-size: 12px; color: var(--muted);
              background: rgba(10,19,34,.9); border: 1px solid var(--border); padding: 3px 10px; border-radius: 999px; margin: 0 0 12px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px 16px 14px; margin: 0 0 14px;
          transition: border-color .3s, transform .3s, box-shadow .3s; }
  .card.on { border-color: color-mix(in srgb, var(--c) 70%, transparent); box-shadow: 0 0 0 1px color-mix(in srgb, var(--c) 40%, transparent), 0 10px 40px -10px color-mix(in srgb, var(--c) 40%, transparent); }
  .kind { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--c); display: flex; align-items: center; gap: 7px; }
  .kind i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }
  .card h3 { margin: 8px 0 2px; font-size: 19px; letter-spacing: -0.01em; }
  .card .sub { color: var(--muted); font-size: 13.5px; }
  .card p { color: #d6cfc4; font-size: 14.5px; line-height: 1.6; margin: 8px 0 0; }
  .card ul { color: #d6cfc4; font-size: 14.5px; line-height: 1.55; padding-left: 18px; margin: 8px 0 0; }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
  .tag { font-family: var(--mono); font-size: 11px; padding: 2px 8px; border-radius: 5px; background: rgba(255,255,255,.05); border: 1px solid var(--border); color: var(--text); }
  .tag.new { color: var(--skill); border-color: rgba(230,191,138,.35); background: rgba(230,191,138,.08); }
  .more { display: inline-block; margin-top: 12px; font-family: var(--mono); font-size: 13px; }

  .outro { text-align: center; padding: 40px 0 10px; }
  .outro h2 { font-size: 26px; margin: 0 0 6px; }
  .outro p { color: var(--muted); margin: 0 0 18px; }
  .btn { display: block; padding: 14px; border-radius: 12px; border: 1px solid var(--border); background: rgba(255,255,255,.04); color: var(--text); text-decoration: none; font-weight: 600; margin: 8px 0; }
  .btn.main { background: var(--job); color: #2a1404; border-color: var(--job); }
  .spacer { height: 30vh; }

  @media (prefers-reduced-motion: reduce) { .scroll-hint i { animation: none; } }
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="net" aria-label="Kariyer ağı"></canvas>
  <div class="bar"><a class="back" href="./" aria-label="Sürümlere dön">‹</a><span class="sp"></span><button class="lang" id="lang"></button></div>
  <div class="year" id="year"></div>
  <div class="counts" id="counts"></div>
</div>

<main id="main"></main>

<script src="../assets/veri.js"></script>
<script>
const UI = {
  tr: { hello: "// merhaba, ben", hint: "aşağı kaydır, kariyerim büyüsün", kinds: { job: "Deneyim", project: "Proje", edu: "Eğitim" },
        newSkills: "yeni", read: "Yazıyı oku →", open: "Aç →", start: "başlangıç", now: "bugün", year: "yıl",
        outroT: "Bugün buradayım.", outroP: "Bir sonraki düğüm sen olabilirsin.", mail: "E-posta gönder", cv: "Klasik CV", net: "Evren görünümü",
        types: { project: "proje", skill: "yetenek" } },
  en: { hello: "// hi, I'm", hint: "scroll down to grow my career", kinds: { job: "Experience", project: "Project", edu: "Education" },
        newSkills: "new", read: "Read post →", open: "Open →", start: "start", now: "today", year: "year",
        outroT: "This is where I am today.", outroP: "You could be the next node.", mail: "Send an email", cv: "Classic CV", net: "Universe view",
        types: { project: "projects", skill: "skills" } },
};
const u = () => UI[lang];
const $ = (id) => document.getElementById(id);
const COLORS = { self: "#fff4e6", job: "#f28c38", project: "#4f8fe6", skill: "#e6bf8a", edu: "#c98b5e" };
const RADIUS = { self: 13, job: 8, edu: 8, project: 6.5, skill: 3.5 };
const LINK_LEN = { self: 110, job: 80, edu: 80, project: 62, skill: 46 };
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---- Ağ ---- */
const nodes = [{ id: "me", type: "self", title: PROFILE.name, year: -Infinity }, ...ITEMS.map((x) => ({ ...x }))];
const N = Object.fromEntries(nodes.map((n) => [n.id, n]));
const edges = [], seen = new Set();
const link = (a, b) => { if (!N[a] || !N[b] || a === b) return; const k = [a, b].sort().join("|"); if (seen.has(k)) return; seen.add(k); edges.push([N[a], N[b]]); };
for (const x of ITEMS) { if (x.type === "job" || x.type === "edu") link("me", x.id); (x.links || []).forEach((l) => link(x.id, l)); }
nodes.forEach((n) => (n.nb = new Set()));
edges.forEach(([a, b]) => { a.nb.add(b); b.nb.add(a); });
for (const n of nodes) if (n.type === "skill") { const ys = [...n.nb].map((m) => m.year).filter(isFinite); n.year = ys.length ? Math.min(...ys) : 0; }
for (const n of nodes) { n.x = (Math.random() - .5) * 8; n.y = (Math.random() - .5) * 8; n.vx = n.vy = 0; n.vis = n.type === "self" ? 1 : 0; n.ph = Math.random() * 6.28; n.r = RADIUS[n.type] + (n.type === "skill" ? Math.min(n.nb.size, 5) * 0.5 : 0); }
const me = N.me;
const yrs = nodes.filter((n) => isFinite(n.year)).map((n) => n.year);
const T0 = Math.floor(Math.min(...yrs)) - 0.5, NOW = new Date().getFullYear() + new Date().getMonth() / 12, T1 = Math.max(NOW, Math.max(...yrs)) + 0.05;
let time = T0, target = T0, focus = null, alpha = 1;

const cv = $("net"), ctx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1;
const cam = { x: 0, y: 0, k: 1 };
function resize() { DPR = Math.min(devicePixelRatio || 1, 2); const r = cv.getBoundingClientRect(); W = r.width; H = r.height; cv.width = W * DPR; cv.height = H * DPR; }

function physics() {
  const live = nodes.filter((n) => n.vis > 0.02);
  for (let i = 0; i < live.length; i++) for (let j = i + 1; j < live.length; j++) {
    const a = live[i], b = live[j];
    let dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy;
    if (d2 < 0.01) { dx = Math.random() - .5; dy = Math.random() - .5; d2 = .5; }
    const d = Math.sqrt(d2), min = a.r + b.r + 9;
    let f = (a.type === "skill" && b.type === "skill" ? 150 : 300) * alpha * a.vis * b.vis / d2;
    if (d < min) f += (min - d) / d * 0.25;
    a.vx -= dx * f; a.vy -= dy * f; b.vx += dx * f; b.vy += dy * f;
  }
  for (const [a, b] of edges) {
    if (a.vis < .02 || b.vis < .02) continue;
    const L = (LINK_LEN[a.type] + LINK_LEN[b.type]) / 2, dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
    const l = (d - L) / d * alpha * (0.5 / Math.min(a.nb.size, b.nb.size + 1)) * Math.min(a.vis, b.vis);
    const wa = a.nb.size / (a.nb.size + b.nb.size);
    b.vx -= dx * l * wa; b.vy -= dy * l * wa; a.vx += dx * l * (1 - wa); a.vy += dy * l * (1 - wa);
  }
  for (const n of live) {
    n.vx -= n.x * 0.014 * alpha; n.vy -= n.y * 0.014 * alpha;
    if (n === me) { n.vx = n.vy = 0; n.x *= .9; n.y *= .9; continue; }
    n.vx *= .6; n.vy *= .6; n.x += n.vx; n.y += n.vy;
  }
  alpha += (0.012 - alpha) * 0.02;
}
function updateVis() {
  for (const n of nodes) {
    if (n === me) continue;
    const t = time >= n.year ? 1 : 0;
    if (t && n.vis === 0) {
      const p = [...n.nb].find((m) => m.vis > .5) || me, a = Math.random() * 6.28;
      n.x = p.x + Math.cos(a) * 20; n.y = p.y + Math.sin(a) * 20; n.vx = n.vy = 0; n.born = performance.now(); alpha = Math.max(alpha, .5);
    }
    n.vis += (t - n.vis) * .1; if (!t && n.vis < .003) n.vis = 0;
  }
}
function frameCam() {
  const vis = nodes.filter((n) => n.vis > .3);
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const n of vis) { x0 = Math.min(x0, n.x); y0 = Math.min(y0, n.y); x1 = Math.max(x1, n.x); y1 = Math.max(y1, n.y); }
  if (vis.length < 2) { x0 = y0 = -60; x1 = y1 = 60; }
  const k = Math.max(.35, Math.min(1.6, Math.min((W - 60) / Math.max(x1 - x0, 1), (H - 110) / Math.max(y1 - y0, 1))));
  cam.k += (k - cam.k) * .08; cam.x += ((x0 + x1) / 2 - cam.x) * .08; cam.y += ((y0 + y1) / 2 - 8 / cam.k - cam.y) * .08;
}
const S = (x, y) => [(x - cam.x) * cam.k + W / 2, (y - cam.y) * cam.k + H / 2];
const hexA = (h, a) => { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };

function draw(now) {
  const t = now / 1000;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = "#0a1322"; ctx.fillRect(0, 0, W, H);
  const fset = focus ? new Set([focus, ...focus.nb]) : null;
  const fx = (n) => n.x + Math.cos(t * .6 + n.ph) * 1.5, fy = (n) => n.y + Math.sin(t * .8 + n.ph) * 1.5;
  for (const [a, b] of edges) {
    const v = Math.min(a.vis, b.vis); if (v < .02) continue;
    const on = fset && (a === focus || b === focus);
    const [x1, y1] = S(fx(a), fy(a)), [x2, y2] = S(fx(b), fy(b));
    ctx.strokeStyle = on ? hexA(COLORS[focus.type], .8 * v) : `rgba(255,255,255,${(fset ? .05 : .13) * v})`;
    ctx.lineWidth = on ? 1.4 : 1;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    if (on && !reduced) { const p = (t * .5) % 1, q = a === focus ? p : 1 - p; ctx.fillStyle = hexA(COLORS[focus.type], v); ctx.beginPath(); ctx.arc(x1 + (x2 - x1) * q, y1 + (y2 - y1) * q, 1.6, 0, 6.28); ctx.fill(); }
  }
  for (const n of nodes.filter((n) => n.vis > .01).sort((a, b) => a.r - b.r)) {
    const [x, y] = S(fx(n), fy(n));
    const dim = fset && !fset.has(n), age = n.born ? (now - n.born) / 1000 : 9;
    const pop = age < .6 ? 1 + Math.sin(age / .6 * Math.PI) * .7 : 1;
    const r = n.r * Math.max(.7, Math.min(1.4, cam.k)) * n.vis * pop * (n === focus ? 1.35 : 1);
    const c = COLORS[n.type], al = (dim ? .18 : 1) * n.vis;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r * 4); g.addColorStop(0, hexA(c, .35 * al)); g.addColorStop(1, hexA(c, 0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 4, 0, 6.28); ctx.fill();
    ctx.fillStyle = hexA(c, al); ctx.beginPath(); ctx.arc(x, y, r, 0, 6.28); ctx.fill();
    const label = n.type !== "skill" || n === focus;
    if (label && n.vis > .4) {
      ctx.globalAlpha = (dim ? .25 : 1) * Math.min(1, (n.vis - .4) * 2);
      ctx.font = n.type === "skill" ? `400 10px "JetBrains Mono", monospace` : `600 ${n.type === "self" ? 12.5 : 11}px Inter, sans-serif`;
      ctx.textAlign = "center"; ctx.textBaseline = "top"; ctx.fillStyle = n.type === "skill" ? "#f3d7ac" : "#f0e8dc";
      ctx.shadowColor = "#0a1322"; ctx.shadowBlur = 5;
      ctx.fillText(n.type === "self" ? PROFILE.name.split(" ")[0] : T(n.title), x, y + r + 5);
      ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    }
  }
}

let lastT = 0, lastUi = 0;
function loop(now) {
  const dt = lastT ? Math.min(.5, (now - lastT) / 1000) : 0; lastT = now;
  time += (target - time) * Math.min(1, dt * 4);
  if (Math.abs(target - time) < .002) time = target;
  updateVis(); physics(); frameCam(); draw(now);
  if (now - lastUi > 80) { lastUi = now; ui(); }
  requestAnimationFrame(loop);
}
function ui() {
  const atEnd = target >= T1 - .01 && time > T1 - .2;
  const y = time <= T0 + .05 ? null : Math.floor(Math.min(time, NOW));
  $("year").innerHTML = `<small>${y == null ? u().start : atEnd ? u().now : u().year}</small>${y == null ? "—" : y}`;
  const live = (t) => nodes.filter((n) => n.type === t && n.vis > .5).length;
  $("counts").innerHTML = `<span style="color:var(--project)"><i></i>${live("project")}</span><span style="color:var(--skill)"><i></i>${live("skill")}</span>`;
}

/* ---- İçerik ---- */
function card(x) {
  const news = skillsOf(x).filter((k) => Math.abs(N[k.id].year - x.year) < 1e-9);
  const old = skillsOf(x).filter((k) => !news.includes(k));
  const pts = T(x.points) || [];
  return `<article class="card" data-id="${x.id}" data-year="${x.year}" style="--c:${COLORS[x.type]}">
    <div class="kind"><i></i>${u().kinds[x.type]}</div>
    <h3>${esc(T(x.title))}</h3>
    ${x.org || x.date ? `<div class="sub">${[T(x.org), T(x.date)].filter(Boolean).map(esc).join(" · ")}</div>` : ""}
    ${x.with ? `<div class="sub">${withHtml(x)}</div>` : ""}
    ${x.desc ? `<p>${esc(T(x.desc))}</p>` : ""}
    ${pts.length ? `<ul>${pts.map((p) => `<li>${esc(p)}</li>`).join("")}</ul>` : ""}
    ${news.length || old.length ? `<div class="tags">${news.map((k) => `<span class="tag new">+ ${esc(T(k.title))}</span>`).join("")}${old.map((k) => `<span class="tag">${esc(T(k.title))}</span>`).join("")}</div>` : ""}
    ${x.url ? `<a class="more" href="${esc(rootUrl(x.url))}">${x.id === "orbit" ? u().read : u().open}</a>` : ""}
  </article>`;
}
function render() {
  document.documentElement.lang = lang;
  $("lang").innerHTML = lang === "tr" ? "<b>TR</b>/EN" : "TR/<b>EN</b>";
  const items = ITEMS.filter((x) => x.type !== "skill").sort((a, b) => a.year - b.year);
  const byYear = {};
  items.forEach((x) => (byYear[Math.floor(x.year)] = byYear[Math.floor(x.year)] || []).push(x));
  $("main").innerHTML = `
    <section class="intro" data-year="${T0}">
      <div class="hello">${u().hello}</div>
      <h1>${esc(PROFILE.name)}</h1>
      <div class="role">${esc(T(PROFILE.role))}</div>
      <p>${esc(T(PROFILE.summary))}</p>
      <div class="scroll-hint"><i>↓</i> ${u().hint}</div>
    </section>
    ${Object.entries(byYear).map(([y, list]) => `<section class="yr"><div class="yr-label">${y}</div>${list.map(card).join("")}</section>`).join("")}
    <section class="outro" data-year="${T1}">
      <h2>${u().outroT}</h2><p>${u().outroP}</p>
      <a class="btn main" href="mailto:${esc(PROFILE.email)}">${u().mail}</a>
      ${PROFILE.socials.map((s) => `<a class="btn" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)} ↗</a>`).join("")}
      <a class="btn" href="../index.html?masaustu=1">${u().cv}</a>
      <a class="btn" href="../evren.html">${u().net}</a>
    </section>
    <div class="spacer"></div>`;
  onScroll();
}

/* Okuma çizgisini geçen kart: ağda zamanı ve odağı belirler */
function onScroll() {
  const line = $("stage").getBoundingClientRect().bottom + 90;
  let active = null;
  for (const el of document.querySelectorAll("[data-year]")) {
    const r = el.getBoundingClientRect();
    if (r.top <= line) active = el;
  }
  document.querySelectorAll(".card.on").forEach((c) => c !== active && c.classList.remove("on"));
  if (!active) { target = T0; focus = null; return; }
  target = Math.min(T1, Math.max(T0, +active.dataset.year + (active.classList.contains("card") ? .01 : 0)));
  if (active.classList.contains("card")) { active.classList.add("on"); focus = N[active.dataset.id]; }
  else focus = active.classList.contains("outro") ? null : null;
}
let ticking = false;
addEventListener("scroll", () => { if (!ticking) { ticking = true; requestAnimationFrame(() => { ticking = false; onScroll(); }); } }, { passive: true });

/* Ağdaki bir yıldıza dokununca ilgili karta git */
cv.addEventListener("click", (e) => {
  const r = cv.getBoundingClientRect(), sx = e.clientX - r.left, sy = e.clientY - r.top;
  let best = null, bd = 26;
  for (const n of nodes) { if (n.vis < .5) continue; const [x, y] = S(n.x, n.y); const d = Math.hypot(x - sx, y - sy); if (d < bd) { bd = d; best = n; } }
  if (!best || best === me) return;
  const id = best.type === "skill" ? [...best.nb].filter((m) => m.type !== "self").sort((a, b) => a.year - b.year)[0]?.id : best.id;
  const el = id && document.querySelector(`.card[data-id="${id}"]`);
  if (el) scrollTo({ top: el.getBoundingClientRect().top + scrollY - $("stage").offsetHeight - 40, behavior: reduced ? "auto" : "smooth" });
  if (best.type === "skill") focus = best;
});

$("lang").onclick = () => { setLang(lang === "tr" ? "en" : "tr"); render(); };
addEventListener("resize", resize);
resize(); render();
requestAnimationFrame(loop);
</script>
</body>
</html>
