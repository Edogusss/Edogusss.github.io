let playing = !reduced;
const hidden = new Set();

/* ---- Canvas & camera ---- */
const cv = $("net"), ctx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1;
const cam = { x: 0, y: 0, k: 1, tk: 1, tx: 0, ty: 0 };
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  fitTarget();
}
// Kamera, kullanıcı elle yakınlaştırana/kaydırana kadar ağın tamamını ekrana sığdırır.
let autoFit = true;
function autoFrame() {
  const vis = nodes.filter((n) => n.vis > 0.3);
  if (vis.length < 2) return;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const n of vis) { x0 = Math.min(x0, n.x); y0 = Math.min(y0, n.y); x1 = Math.max(x1, n.x); y1 = Math.max(y1, n.y); }
  const mobile = W < 720;
  const padX = mobile ? 50 : 140, top = mobile ? 110 : 90, bottom = mobile ? 150 : 120;
  const k = Math.min((W - padX * 2) / Math.max(x1 - x0, 1), (H - top - bottom) / Math.max(y1 - y0, 1));
  cam.tk = Math.max(0.3, Math.min(1.3, k));
  cam.tx = (x0 + x1) / 2;
  cam.ty = (y0 + y1) / 2 + (bottom - top) / 2 / cam.tk;
}
function fitTarget() {
  const mobile = W < 720;
  cam.tk = Math.max(0.45, Math.min(1.3, Math.min(W, H) / (mobile ? 640 : 760)));
  cam.tx = mobile ? 0 : -40; cam.ty = mobile ? 20 : 0;
}
const toScreen = (x, y) => [(x - cam.x) * cam.k + W / 2, (y - cam.y) * cam.k + H / 2];
const toWorld = (sx, sy) => [(sx - W / 2) / cam.k + cam.x, (sy - H / 2) / cam.k + cam.y];

/* ---- Stars ---- */
const stars = Array.from({ length: 260 }, () => ({
  x: Math.random() * 3000 - 1500, y: Math.random() * 3000 - 1500,
  z: 0.05 + Math.random() * 0.25, s: Math.random() * 1.2 + 0.2, p: Math.random() * 6.28,
}));

/* ---- Physics ---- */
let alpha = 1;
function physics() {
  const live = nodes.filter((n) => n.vis > 0.02);
  // itme + çarpışma
  for (let i = 0; i < live.length; i++) {
    const a = live[i];
    for (let j = i + 1; j < live.length; j++) {
      const b = live[j];
      let dx = b.x - a.x, dy = b.y - a.y;
      let d2 = dx * dx + dy * dy;
      if (d2 < 0.01) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; d2 = 0.5; }
      const d = Math.sqrt(d2);
      const str = (a.type === "skill" && b.type === "skill" ? 260 : 520) * alpha * a.vis * b.vis;
      let f = str / d2;
      const min = a.r + b.r + 14;
      if (d < min) f += (min - d) / d * 0.25;
      a.vx -= dx * f; a.vy -= dy * f; b.vx += dx * f; b.vy += dy * f;
    }
  }
  // yaylar
  for (const e of edges) {
    const a = e.s, b = e.t;
    if (a.vis < 0.02 || b.vis < 0.02) continue;
    const L = (LINK_LEN[a.type] + LINK_LEN[b.type]) / 2;
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.sqrt(dx * dx + dy * dy) || 1;
    const s = 0.5 / Math.min(a.nb.size, b.nb.size + 1);
    const l = (d - L) / d * alpha * s * Math.min(a.vis, b.vis);
    const wa = a.nb.size / (a.nb.size + b.nb.size), wb = 1 - wa;
    b.vx -= dx * l * wa; b.vy -= dy * l * wa; a.vx += dx * l * wb; a.vy += dy * l * wb;
  }
  for (const n of live) {
    n.vx -= n.x * 0.014 * alpha; n.vy -= n.y * 0.014 * alpha;   // merkeze çekim
    if (n === me || n === drag.node) { n.vx = n.vy = 0; if (n === me && drag.node !== me) { n.x *= 0.9; n.y *= 0.9; } continue; }
    n.vx *= 0.6; n.vy *= 0.6;
    n.x += n.vx; n.y += n.vy;
  }
  alpha += ((drag.node ? 0.3 : 0.012) - alpha) * 0.02;
}

/* ---- Timeline-driven visibility ---- */
function updateVisibility() {
  for (const n of nodes) {
    if (n === me) continue;
    const target = !hidden.has(n.type) && time >= n.year ? 1 : 0;
    if (target && n.vis === 0) {
      // yeni doğan yıldız: görünür bir komşusunun yanında belirir
      const parent = [...n.nb].find((m) => m.vis > 0.5) || me;
      const a = Math.random() * Math.PI * 2;
      n.x = parent.x + Math.cos(a) * 30; n.y = parent.y + Math.sin(a) * 30; n.vx = n.vy = 0;
      n.born = performance.now();
      alpha = Math.max(alpha, 0.5);
    }
    n.vis += (target - n.vis) * 0.08;
    if (n.vis < 0.003 && !target) n.vis = 0;
  }
}

/* ---- Interaction state ---- */
let hover = null, selected = null;
const drag = { node: null, pan: false, sx: 0, sy: 0, moved: false, id: null };
const pointers = new Map();
let pinch = null;

function focusSet() {
  const f = selected || hover;
  if (!f) return null;
  const s = new Set([f, ...f.nb]);
  return s;
}

/* ---- Render ---- */
function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
}

function draw(now) {
  const t = now / 1000;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = "#05070c"; ctx.fillRect(0, 0, W, H);

  // nebula
  const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.7);
  g.addColorStop(0, "rgba(56,189,248,0.06)"); g.addColorStop(0.5, "rgba(192,132,252,0.03)"); g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  for (const s of stars) {
    let x = (s.x - cam.x * s.z) % W, y = (s.y - cam.y * s.z) % H;
    if (x < 0) x += W; if (y < 0) y += H;
    ctx.globalAlpha = 0.35 + 0.35 * Math.sin(t * 1.3 + s.p);
    ctx.fillStyle = "#cfd8ff";
    ctx.fillRect(x, y, s.s, s.s);
  }
  ctx.globalAlpha = 1;

  const fs = focusSet();
  const fl = (n) => n.x + Math.cos(t * 0.6 + n.phase) * 2.5;
  const fy = (n) => n.y + Math.sin(t * 0.8 + n.phase) * 2.5;

  // kenarlar
  ctx.lineWidth = 1;
  for (const e of edges) {
    const a = e.s, b = e.t, v = Math.min(a.vis, b.vis);
    if (v < 0.02) continue;
    const on = fs && fs.has(a) && fs.has(b) && (a === (selected || hover) || b === (selected || hover));
    const [x1, y1] = toScreen(fl(a), fy(a)), [x2, y2] = toScreen(fl(b), fy(b));
    const grad = ctx.createLinearGradient(x1, y1, x2, y2);
    const al = (fs ? (on ? 0.85 : 0.04) : 0.22) * v;
    grad.addColorStop(0, hexA(COLORS[a.type], al)); grad.addColorStop(1, hexA(COLORS[b.type], al));
    ctx.strokeStyle = grad; ctx.lineWidth = on ? 1.6 : 1;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    if (on) {
      // akan ışık parçacıkları
      for (let k = 0; k < 3; k++) {
        const p = (t * 0.45 + k / 3) % 1;
        const from = a === (selected || hover) ? 0 : 1;
        const q = from ? 1 - p : p;
        ctx.fillStyle = hexA(COLORS[(selected || hover).type], 0.9 * v);
        ctx.beginPath(); ctx.arc(x1 + (x2 - x1) * q, y1 + (y2 - y1) * q, 1.8, 0, 6.28); ctx.fill();
      }
    }
  }

  // düğümler
  const sorted = nodes.filter((n) => n.vis > 0.01).sort((a, b) => a.r - b.r);
  for (const n of sorted) {
    const [x, y] = toScreen(fl(n), fy(n));
    const dim = fs && !fs.has(n);
    const age = n.born ? (now - n.born) / 1000 : 9;
    const pop = age < 0.6 ? 1 + Math.sin(age / 0.6 * Math.PI) * 0.6 : 1;
    const r = n.r * Math.min(1.6, Math.max(0.6, cam.k)) * n.vis * pop * (n === hover || n === selected ? 1.25 : 1);
    const c = COLORS[n.type];
    const al = (dim ? 0.15 : 1) * n.vis;

    // hale
    const glow = ctx.createRadialGradient(x, y, 0, x, y, r * 4);
    glow.addColorStop(0, hexA(c, 0.35 * al)); glow.addColorStop(1, hexA(c, 0));
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(x, y, r * 4, 0, 6.28); ctx.fill();

    if (n.type === "self") {
      // yörünge halkaları
      ctx.strokeStyle = `rgba(255,255,255,${0.18 * al})`; ctx.lineWidth = 1;
      for (let k = 0; k < 2; k++) {
        ctx.beginPath(); ctx.arc(x, y, r * (1.7 + k * 0.6) + Math.sin(t * 2 + k) * 2, 0, 6.28); ctx.stroke();
      }
    }
    ctx.fillStyle = hexA(c, al);
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.28); ctx.fill();
    if (n.type === "job" || n.type === "edu") {
      ctx.strokeStyle = hexA("#05070c", al); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, r * 0.45, 0, 6.28); ctx.stroke();
    }

    // etiket
    const showLabel = n.type !== "skill" || cam.k > 0.75 || (fs && fs.has(n));
    if (showLabel && n.vis > 0.3) {
      const label = T(n.title);
      ctx.globalAlpha = (dim ? 0.2 : 1) * Math.min(1, (n.vis - 0.3) * 2);
      if (n.type === "self") ctx.font = `700 ${15}px Inter, sans-serif`;
      else if (n.type === "skill") ctx.font = `400 11px "JetBrains Mono", monospace`;
      else ctx.font = `600 12.5px Inter, sans-serif`;
      ctx.textAlign = "center"; ctx.textBaseline = "top";
      ctx.fillStyle = n.type === "skill" ? "#a9f5c4" : "#e4e8f0";
      ctx.shadowColor = "#05070c"; ctx.shadowBlur = 6;
      ctx.fillText(label, x, y + r + (n.type === "self" ? 18 : 7));
      ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    }
  }
}

/* ---- Main loop ---- */
let lastUi = 0, lastFrame = 0;
function frame(now) {
  const dt = lastFrame ? Math.min(0.25, (now - lastFrame) / 1000) : 0;
  lastFrame = now;
  if (playing) {
    time += (T1 - T0) * dt / 9;   // kare hızından bağımsız: ~9 saniyede tüm kariyer
    if (time >= T1) { time = T1; playing = false; updatePlayIcon(); }
  }
  updateVisibility();
  physics();
  const k = 0.08;
  cam.k += (cam.tk - cam.k) * k;
  if (autoFit && !selected && !drag.node) autoFrame();
  if (!drag.pan && !pinch) { cam.x += (cam.tx - cam.x) * k; cam.y += (cam.ty - cam.y) * k; }
  draw(now);
  if (now - lastUi > 50) { updateTimeline(); lastUi = now; }
  requestAnimationFrame(frame);
}

/* ---- Hit test ---- */
function pick(sx, sy) {
  const [wx, wy] = toWorld(sx, sy);
  let best = null, bd = Infinity;
  for (const n of nodes) {
    if (n.vis < 0.5) continue;
    const d = Math.hypot(n.x - wx, n.y - wy);
    const rr = (n.r * Math.min(1.6, Math.max(0.6, cam.k))) / cam.k + 8 / cam.k;
    if (d < rr && d < bd) { best = n; bd = d; }
  }
  return best;
}

/* ---- Pointer events ---- */
cv.addEventListener("pointerdown", (e) => {
  cv.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) {
    const [p, q] = [...pointers.values()];
    autoFit = false;
    pinch = { d: Math.hypot(p.x - q.x, p.y - q.y), k: cam.tk };
    drag.node = null; drag.pan = false;
    return;
  }
  dismissHint();
  const n = pick(e.clientX, e.clientY);
  drag.sx = e.clientX; drag.sy = e.clientY; drag.moved = false; drag.id = e.pointerId;
  if (n) { drag.node = n; } else { drag.pan = true; drag.cx = cam.x; drag.cy = cam.y; }
  cv.classList.add("dragging");
});
cv.addEventListener("pointermove", (e) => {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && pointers.size === 2) {
    const [p, q] = [...pointers.values()];
    cam.tk = cam.k = clampK(pinch.k * Math.hypot(p.x - q.x, p.y - q.y) / pinch.d);
    return;
  }
  if (drag.id === e.pointerId && (drag.node || drag.pan)) {
    if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 4) drag.moved = true;
    if (drag.node && drag.moved) {
      const [wx, wy] = toWorld(e.clientX, e.clientY);
      drag.node.x = wx; drag.node.y = wy;
      alpha = Math.max(alpha, 0.3);
    } else if (drag.pan) {
      autoFit = false;
      cam.x = cam.tx = drag.cx - (e.clientX - drag.sx) / cam.k;
      cam.y = cam.ty = drag.cy - (e.clientY - drag.sy) / cam.k;
    }
    return;
  }
  const n = pick(e.clientX, e.clientY);
  hover = n;
  cv.classList.toggle("pointer", !!n);
});
function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (drag.id !== e.pointerId) return;
  if (!drag.moved) {
    const n = pick(e.clientX, e.clientY);
    if (n) select(n); else if (drag.pan) select(null);
  }
  drag.node = null; drag.pan = false; drag.id = null;
  cv.classList.remove("dragging");
  if (e.pointerType !== "mouse") hover = null;
}
cv.addEventListener("pointerup", endPointer);
cv.addEventListener("pointercancel", endPointer);
cv.addEventListener("pointerleave", () => { if (!drag.node && !drag.pan) hover = null; });

const clampK = (k) => Math.max(0.3, Math.min(3, k));
// Kaydırma = zamanda yolculuk · Ctrl/⌘ + kaydırma = yakınlaştırma
cv.addEventListener("wheel", (e) => {
  e.preventDefault();
  dismissHint();
  if (e.ctrlKey || e.metaKey) { autoFit = false; cam.tk = clampK(cam.tk * Math.exp(-e.deltaY * 0.002)); return; }
  playing = false; updatePlayIcon();
  time = Math.max(T0, Math.min(T1, time + e.deltaY * 0.004));
}, { passive: false });

$("zin").onclick = () => { autoFit = false; cam.tk = clampK(cam.tk * 1.25); };
$("zout").onclick = () => { autoFit = false; cam.tk = clampK(cam.tk / 1.25); };
$("zfit").onclick = () => { autoFit = true; select(null); };

addEventListener("keydown", (e) => {
  if (e.key === "Escape") { select(null); }
  if (e.target !== document.body) return;
  if (e.key === "ArrowRight") { time = Math.min(T1, time + 0.25); playing = false; updatePlayIcon(); }
  if (e.key === "ArrowLeft") { time = Math.max(T0, time - 0.25); playing = false; updatePlayIcon(); }
  if (e.key === " ") { e.preventDefault(); togglePlay(); }
});

/* ---- Selection & panel ---- */
function select(n) {
  selected = n;
  const p = $("panel");
  if (!n) { p.classList.remove("open"); cam.tx = cam.x; cam.ty = cam.y; return; }
  // seçilen yıldızı panelin solunda ortala
  const mobile = W < 720;
  cam.tx = n.x + (mobile ? 0 : 160 / cam.tk);
  cam.ty = n.y + (mobile ? H * 0.22 / cam.tk : 0);
  renderPanel();
  p.classList.add("open");
  p.scrollTop = 0;
}

function renderPanel() {
  const n = selected; if (!n) return;
  const u = UI[lang], c = COLORS[n.type];
  let h = `<button class="close" id="pclose" aria-label="${u.close}">✕</button>`;
  h += `<div class="type" style="color:${c}"><i></i>${u.types[n.type]}</div>`;
  if (n.type === "self") {
    h += `<h2>${esc(PROFILE.name)}</h2><div class="org">${esc(T(PROFILE.role))}</div>`;
    h += `<p>${esc(T(PROFILE.summary))}</p>`;
    h += `<h4>${u.languages}</h4><p style="margin:0">${esc(T(PROFILE.languages))}</p>`;
    h += `<div class="links">${contactButtons()}</div>`;
  } else {
    h += `<h2>${esc(T(n.title))}</h2>`;
    if (n.org) h += `<div class="org">${esc(T(n.org))}</div>`;
    if (n.date) h += `<div class="date">${esc(T(n.date))}</div>`;
    else if (n.type === "skill") h += `<div class="date">${u.firstSeen}: ${Math.floor(n.year)}</div>`;
    else if (n.type === "project") h += `<div class="date">${Math.floor(n.year)}</div>`;
    if (n.desc) h += `<p>${esc(T(n.desc))}</p>`;
    const pts = T(n.points);
    if (pts && pts.length) h += `<ul>${pts.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>`;
    if (n.url) h += `<div class="links"><a class="tbtn" href="${esc(n.url)}"${/^https?:/.test(n.url) ? ' target="_blank" rel="noopener"' : ""}>${u.view}</a></div>`;
  }
  const groups = {};
  [...n.nb].sort((a, b) => (a.year || 0) - (b.year || 0)).forEach((m) => (groups[m.type] = groups[m.type] || []).push(m));
  const order = n.type === "skill" ? ["job", "project", "edu"] : ["self", "job", "edu", "project", "skill"];
  for (const ty of order) {
    if (!groups[ty]) continue;
    const label = ty === "skill" ? u.built : n.type === "skill" ? u.usedIn : u.connections;
    h += `<h4>${label} · ${u.types[ty]}</h4><div class="conns">` +
      groups[ty].map((m) => `<button class="conn" data-id="${m.id}" style="color:${COLORS[m.type]}"><i></i><span>${esc(T(m.title))}</span></button>`).join("") +
      `</div>`;
  }
  $("panel").innerHTML = h;
  $("pclose").onclick = () => select(null);
  $("panel").querySelectorAll(".conn").forEach((b) => (b.onclick = () => {
    const m = byId[b.dataset.id];
    if (m.vis < 0.5) { time = Math.max(time, m.year + 0.01); playing = false; updatePlayIcon(); }
    select(m);
  }));
}

function contactButtons() {
  return `<a class="tbtn accent" href="mailto:${esc(PROFILE.email)}">${esc(PROFILE.email)}</a>` +
    PROFILE.socials.map((s) => `<a class="tbtn" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)} ↗</a>`).join("") +
    (PROFILE.cvPdf ? `<a class="tbtn" href="${esc(PROFILE.cvPdf)}" download>PDF ↓</a>` : "");
}

/* ---- Timeline UI ---- */
const track = $("track");
function buildTrack() {
  let h = `<div class="line"></div><div class="fill" id="tfill"></div>`;
  for (let y = Math.ceil(T0); y <= Math.floor(T1); y++) {
    const p = ((y - T0) / (T1 - T0)) * 100;
    h += `<div class="dot" style="left:${p}%"></div>`;
    if (W >= 520 || y % 2 === 0) h += `<div class="tick" style="left:${p}%">${y}</div>`;
  }
  h += `<div class="knob" id="tknob"></div>`;
  track.innerHTML = h;
}
function updateTimeline() {
  const p = ((time - T0) / (T1 - T0)) * 100;
  const f = $("tfill"), k = $("tknob");
  if (f) f.style.width = p + "%";
  if (k) k.style.left = p + "%";
  const atEnd = time >= T1 - 0.01;
  $("year").innerHTML = `${atEnd ? Math.floor(NOW) : Math.floor(Math.max(time, T0 + 0.6))}<small>${atEnd ? UI[lang].now : UI[lang].year}</small>`;
}
function scrub(e) {
  const r = track.getBoundingClientRect();
  time = T0 + Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * (T1 - T0);
}
track.addEventListener("pointerdown", (e) => {
  track.setPointerCapture(e.pointerId); playing = false; updatePlayIcon(); dismissHint(); scrub(e);
  track.onpointermove = scrub;
});
track.addEventListener("pointerup", () => (track.onpointermove = null));

function updatePlayIcon() {
  $("play").innerHTML = playing
    ? `<svg viewBox="0 0 14 14"><rect x="2" y="1" width="3.5" height="12" rx="1"/><rect x="8.5" y="1" width="3.5" height="12" rx="1"/></svg>`
    : `<svg viewBox="0 0 14 14"><path d="M3 1.5v11l9.5-5.5z"/></svg>`;
}
function togglePlay() {
  if (!playing && time >= T1 - 0.01) time = T0;
  playing = !playing; updatePlayIcon();
}
$("play").onclick = togglePlay;

/* ---- Hint ---- */
let hintTimer = setTimeout(dismissHint, 14000);
function dismissHint() { $("hint").classList.add("hide"); clearTimeout(hintTimer); }

/* ---- Legend / filters ---- */
function renderLegend() {
  const u = UI[lang];
  $("legend").innerHTML = TYPE_ORDER.map((ty) => {
    const cnt = nodes.filter((n) => n.type === ty).length;
    return `<button class="chip ${hidden.has(ty) ? "off" : ""}" data-t="${ty}" style="color:${COLORS[ty]}" aria-pressed="${!hidden.has(ty)}">
      <i></i><span style="color:var(--text)">${u.types[ty]}</span><span class="n">${cnt}</span></button>`;
  }).join("");
  $("legend").querySelectorAll(".chip").forEach((b) => (b.onclick = () => {
    const ty = b.dataset.t;
    hidden.has(ty) ? hidden.delete(ty) : hidden.add(ty);
    if (selected && hidden.has(selected.type)) select(null);
    renderLegend();
  }));
}

$("contact-btn").onclick = () => select(me);

/* ---- i18n ---- */
function renderText() {
  const u = UI[lang];
  document.documentElement.lang = lang;
  $("hello").textContent = u.hello;
  $("name").textContent = PROFILE.name;
  $("role").textContent = T(PROFILE.role);
  $("lang-btn").innerHTML = lang === "tr" ? "<b>TR</b> / EN" : "TR / <b>EN</b>";
  $("flat-btn").textContent = u.flat + " ↗";
  $("contact-btn").textContent = u.contact;
  $("posts-link").textContent = u.posts;
  $("hint").innerHTML = u.hint.map((x) => `<span>${x}</span>`).join("");
  renderLegend(); renderPanel(); updateTimeline();
}
$("lang-btn").onclick = () => {
  lang = lang === "tr" ? "en" : "tr";
  try { localStorage.setItem("lang", lang); } catch (e) {}
  renderText();
};

/* ---- Start ---- */
addEventListener("resize", () => { resize(); buildTrack(); });
resize(); buildTrack(); updatePlayIcon(); renderText();
cam.k = cam.tk * 0.4; cam.x = cam.tx; cam.y = cam.ty;
if (reduced) for (let i = 0; i < 300; i++) { updateVisibility(); physics(); }
requestAnimationFrame(frame);
</script>
