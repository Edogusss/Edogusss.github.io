<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
/* Telefondan dışarıdan gelen ziyaretçiyi dört mobil sürümden birine rastgele gönder.
   Site içinden gelen ya da ?masaustu=1 ile açan yönlendirilmez. */
(function () {
  try {
    var phone = matchMedia("(pointer: coarse)").matches && Math.min(screen.width, innerWidth) < 760;
    var internal = document.referrer && new URL(document.referrer).origin === location.origin;
    if (!phone || internal || /[?&]masaustu=1/.test(location.search)) return;
    var all = ["sohbet", "hikaye", "ag", "terminal"], last = null;
    try { last = localStorage.getItem("mobil-son"); } catch (e) {}
    var pool = all.filter(function (v) { return v !== last; });
    var pick = pool[Math.floor(Math.random() * pool.length)];
    try { localStorage.setItem("mobil-son", pick); } catch (e) {}
    location.replace("mobil/" + pick + ".html");
  } catch (e) {}
})();
</script>
<title>Doğukan Sansar — Junior Pentester</title>
<meta name="description" content="Doğukan Sansar — junior pentester. Özgeçmiş, projeler, CTF çözümleri ve blog yazıları.">
<meta name="theme-color" content="#0b1424">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b1424; --bg-soft: #0f1b2e; --card: #13223a; --card-hi: #172b48; --rule: #223650;
    --text: #efe7da; --soft: #cdc6ba; --muted: #94a0b6;
    --orange: #f59145; --orange-2: #ffb673; --blue: #74a8f0; --sky: #9cc3ff; --copper: #cf9163; --sand: #e9c79a; --green: #7fd0a0;
    --serif: "Fraunces", Georgia, serif; --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 16.5px; line-height: 1.62;
    background-image:
      radial-gradient(1100px 520px at 88% -8%, rgba(117,168,230,.12), transparent 62%),
      radial-gradient(760px 520px at -8% 8%, rgba(245,145,69,.09), transparent 60%);
    background-attachment: fixed;
  }
  a { color: var(--orange-2); text-decoration: none; }
  a:hover { color: var(--orange); }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  ::selection { background: var(--orange); color: #241001; }

  .page { max-width: 880px; margin: 0 auto; padding: 30px 26px 80px; }

  .top { display: flex; align-items: center; gap: 12px; font-family: var(--mono); font-size: 13px; margin-bottom: 40px; }
  .top .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px var(--green); flex-shrink: 0; }
  .top .tag { color: var(--muted); }
  .top .sp { flex: 1; }
  .top a, .top button { color: var(--muted); padding: 6px 10px; border-radius: 8px; border: 1px solid transparent; }
  .top a:hover, .top button:hover { color: var(--text); background: rgba(170,190,220,.07); }
  .top a.evren { color: var(--orange-2); border-color: rgba(245,145,69,.4); }
  .top a.evren:hover { background: rgba(245,145,69,.12); color: var(--orange-2); }

  header { position: relative; }
  .hi { font-family: var(--mono); font-size: 14px; color: var(--orange); }
  .hi .cursor { display: inline-block; width: 8px; height: 1.05em; background: var(--orange); margin-left: 2px; vertical-align: -2px; animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  h1 { font-family: var(--serif); font-weight: 600; font-size: clamp(40px, 7vw, 62px); line-height: 1.02; letter-spacing: -0.02em; margin: 10px 0 2px; }
  .underline { display: block; width: 210px; max-width: 70%; height: 11px; margin: 2px 0 14px; color: var(--orange); }
  .role { font-size: 19px; color: var(--soft); }
  .role b { color: var(--text); font-weight: 600; }
  .contact { font-family: var(--mono); font-size: 13px; margin-top: 18px; display: flex; flex-wrap: wrap; gap: 8px 10px; }
  .contact a { display: inline-flex; align-items: center; gap: 7px; color: var(--soft); background: var(--card); border: 1px solid var(--rule); border-radius: 999px; padding: 6px 13px; }
  .contact a:hover { border-color: var(--orange); color: var(--orange-2); }
  .contact a span { color: var(--copper); }
  .summary { margin: 24px 0 0; max-width: 660px; color: var(--soft); font-size: 17px; }

  section { margin-top: 46px; }
  .sec-head { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .sec-head .no { font-family: var(--mono); font-size: 13px; color: var(--orange); }
  .sec-head h2 { font-family: var(--serif); font-weight: 600; font-size: 25px; margin: 0; letter-spacing: -0.01em; }
  .sec-head::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--rule), transparent); }
  .sec-head a { font-family: var(--mono); font-size: 12.5px; white-space: nowrap; }

  .entry { position: relative; background: var(--card); border: 1px solid var(--rule); border-radius: 14px; padding: 18px 20px 16px; margin-bottom: 14px;
           border-left: 3px solid var(--copper); transition: transform .18s, border-color .18s, background .18s; }
  .entry:hover { transform: translateX(3px); background: var(--card-hi); border-left-color: var(--orange); }
  .entry .line { display: flex; justify-content: space-between; align-items: baseline; gap: 4px 16px; flex-wrap: wrap; }
  .entry h3 { margin: 0; font-size: 17.5px; font-weight: 600; }
  .entry h3 .org { font-weight: 400; color: var(--soft); }
  .entry h3 .with { font-weight: 400; color: var(--muted); font-size: 14.5px; }
  .entry .when { font-family: var(--mono); font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  .entry p { margin: 7px 0 0; color: var(--soft); font-size: 15.5px; }
  .entry ul { margin: 8px 0 0; padding-left: 2px; list-style: none; }
  .entry li { position: relative; padding-left: 20px; margin: 4px 0; color: var(--soft); font-size: 15.5px; }
  .entry li::before { content: ""; position: absolute; left: 1px; top: 11px; width: 8px; height: 2px; background: var(--orange); border-radius: 2px; }
  .entry .stack { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
  .entry .stack span { font-family: var(--mono); font-size: 11.5px; color: var(--sand); background: rgba(233,199,154,.08); border: 1px solid rgba(233,199,154,.18); border-radius: 6px; padding: 2px 8px; }

  .projects { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  @media (max-width: 680px) { .projects { grid-template-columns: 1fr; } }
  .proj { position: relative; display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--rule); border-radius: 14px; padding: 18px 18px 16px; overflow: hidden; transition: transform .18s, border-color .18s; }
  .proj::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: linear-gradient(90deg, var(--orange), var(--copper)); }
  .proj:hover { transform: translateY(-3px); border-color: rgba(245,145,69,.5); }
  .proj.feat { grid-column: 1 / -1; }
  .proj .yr { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .proj h3 { font-family: var(--serif); font-weight: 600; font-size: 21px; margin: 5px 0 2px; }
  .proj .with { font-size: 13.5px; color: var(--muted); margin-bottom: 7px; }
  .proj p { margin: 0 0 12px; color: var(--soft); font-size: 15px; flex: 1; }
  .proj .stack { display: flex; flex-wrap: wrap; gap: 5px; }
  .proj .stack span { font-family: var(--mono); font-size: 11px; color: var(--sand); }
  .proj .stack span + span::before { content: "· "; color: var(--muted); }
  .proj .more { margin-top: 12px; font-family: var(--mono); font-size: 12.5px; color: var(--orange-2); }

  dl.skills { margin: 0; display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 12px 20px; }
  dl.skills dt { font-family: var(--mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--copper); padding-top: 4px; }
  dl.skills dd { margin: 0; display: flex; flex-wrap: wrap; gap: 6px; }
  dl.skills .chip { font-family: var(--mono); font-size: 12.5px; color: var(--soft); background: var(--card); border: 1px solid var(--rule); border-radius: 7px; padding: 3px 10px; }
  @media (max-width: 560px) { dl.skills { grid-template-columns: 1fr; gap: 4px 0; } dl.skills dt { margin-top: 10px; } }

  .posts { display: grid; gap: 10px; }
  .post { display: grid; grid-template-columns: 96px 1fr; gap: 0 16px; align-items: baseline; padding: 11px 14px; border-radius: 11px; border: 1px solid transparent; color: var(--text); }
  .post:hover { background: var(--card); border-color: var(--rule); }
  .post .d { font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
  .post .ttl { font-size: 16px; }
  .post .badge { font-family: var(--mono); font-size: 10.5px; font-weight: 600; letter-spacing: .05em; padding: 1px 7px; border-radius: 4px; margin-right: 9px; vertical-align: 1px; }
  .post .badge.ctf { color: #ff9f7f; background: rgba(255,138,107,.13); }
  .post .badge.blog { color: var(--sky); background: rgba(140,188,255,.13); }
  @media (max-width: 520px) { .post { grid-template-columns: 1fr; gap: 3px; } }
  .more-row { margin-top: 10px; font-family: var(--mono); font-size: 13px; }
  .empty { color: var(--muted); font-size: 15px; }

  footer { margin-top: 56px; border-top: 1px solid var(--rule); padding-top: 22px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px 20px; font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
  footer button { color: var(--muted); }
  footer button:hover { color: var(--orange-2); }

  @media print {
    :root { --bg: #fff; --bg-soft: #fff; --card: #fff; --card-hi: #fff; --text: #111; --soft: #333; --muted: #666; --rule: #ddd; --orange: #b85a12; --orange-2: #b85a12; --copper: #9a6a45; --sand: #7a4f2c; }
    body { background: #fff; }
    .top, .proj .more, footer button, .cursor { display: none !important; }
    .entry, .proj { break-inside: avoid; border-left-color: #ddd; }
    .entry:hover, .proj:hover { transform: none; }
    a { color: #111; }
    section { margin-top: 20px; }
  }
</style>
</head>
<body>
<div class="page">
  <nav class="top">
    <span class="dot" title="Yeni fırsatlara açık"></span>
    <span class="tag" id="avail"></span>
    <span class="sp"></span>
    <a href="yazilar.html" id="nav-posts"></a>
    <a class="evren" href="evren.html" id="nav-evren"></a>
    <button id="lang-btn" aria-label="Dil / Language"></button>
  </nav>

  <header>
    <div class="hi"><span id="hi"></span><span class="cursor"></span></div>
    <h1 id="name"></h1>
    <svg class="underline" viewBox="0 0 300 12" preserveAspectRatio="none" aria-hidden="true"><path d="M2 8 C 60 2, 110 2, 150 6 S 250 11, 298 4" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/></svg>
    <div class="role" id="role"></div>
    <div class="contact" id="contact"></div>
    <p class="summary" id="summary"></p>
  </header>

  <section id="experience"><div class="sec-head"><span class="no">01</span><h2 data-t="experience"></h2></div><div id="exp"></div></section>
  <section id="projects"><div class="sec-head"><span class="no">02</span><h2 data-t="projects"></h2></div><div class="projects" id="proj"></div></section>
  <section id="skills"><div class="sec-head"><span class="no">03</span><h2 data-t="skills"></h2></div><div id="skl"></div></section>
  <section id="education"><div class="sec-head"><span class="no">04</span><h2 data-t="education"></h2></div><div id="edu"></div></section>
  <section id="posts"><div class="sec-head"><span class="no">05</span><h2 data-t="posts"></h2><a href="yazilar.html" id="all-posts"></a></div><div class="posts" id="pst"></div></section>

  <footer>
    <span id="evren-note"></span>
    <button id="print-btn"></button>
  </footer>
</div>

<script src="assets/veri.js"></script>
<script>
const UI = {
  tr: {
    experience: "Deneyim", projects: "Projeler", skills: "Yetenekler", education: "Eğitim", posts: "Son yazılar",
    navPosts: "✎ ctf & blog", navEvren: "✦ evren", langs: "Diller", allPosts: "tümü →", avail: "yeni fırsatlara açık",
    hi: "merhaba, ben", read: "yazıyı oku →", open: "aç →", feat: "öne çıkan",
    noPosts: "Henüz yazı yok; ilk CTF çözümlerim yakında burada olacak.",
    evren: 'Bu özgeçmişin canlı bir hâli de var → <a href="evren.html">evren</a>', print: "yazdır / pdf",
  },
  en: {
    experience: "Experience", projects: "Projects", skills: "Skills", education: "Education", posts: "Latest posts",
    navPosts: "✎ ctf & blog", navEvren: "✦ universe", langs: "Languages", allPosts: "all →", avail: "open to opportunities",
    hi: "hi, I'm", read: "read →", open: "open →", feat: "featured",
    noPosts: "No posts yet; my first CTF write-ups will be here soon.",
    evren: 'There is also a living version of this resume → <a href="evren.html">universe</a>', print: "print / pdf",
  },
};
const u = () => UI[lang];
const $ = (id) => document.getElementById(id);
let posts = [];
const extLink = (href, text, cls = "") => `<a class="${cls}" href="${esc(href)}"${/^https?:/.test(href) ? ' target="_blank" rel="noopener"' : ""}>${esc(text)}</a>`;

function entry(x) {
  const pts = T(x.points) || [];
  const title = x.type === "project" && x.url ? extLink(rootUrl(x.url), T(x.title)) : esc(T(x.title));
  return `<div class="entry">
    <div class="line"><h3>${title}${x.org ? `<span class="org">, ${esc(T(x.org))}</span>` : ""}${x.with ? `<span class="with"> · ${withHtml(x)}</span>` : ""}</h3><span class="when">${esc(T(x.date) || Math.floor(x.year))}</span></div>
    ${x.desc ? `<p>${esc(T(x.desc))}</p>` : ""}
    ${pts.length ? `<ul>${pts.map((p) => `<li>${esc(p)}</li>`).join("")}</ul>` : ""}
    ${x.type !== "edu" && skillsOf(x).length ? `<div class="stack">${skillsOf(x).map((s) => `<span>${esc(T(s.title))}</span>`).join("")}</div>` : ""}
  </div>`;
}

function renderPosts() {
  $("all-posts").textContent = u().allPosts;
  $("pst").innerHTML = posts.length
    ? posts.slice(0, 5).map((p) => `<a class="post" href="yazi.html?y=${encodeURIComponent(p.slug)}"><span class="d">${esc(p.tarih)}</span><span class="ttl"><span class="badge ${p.tur}">${p.tur === "ctf" ? "CTF" : "BLOG"}</span>${esc(p.baslik)}</span></a>`).join("")
      + (posts.length > 5 ? `<div class="more-row"><a href="yazilar.html">${u().allPosts}</a></div>` : "")
    : `<p class="empty">${u().noPosts}</p>`;
}

function render() {
  document.documentElement.lang = lang;
  $("lang-btn").textContent = lang === "tr" ? "english" : "türkçe";
  $("avail").textContent = u().avail;
  $("nav-posts").textContent = u().navPosts;
  $("nav-evren").textContent = u().navEvren;
  $("hi").textContent = u().hi + " ";
  document.querySelectorAll("[data-t]").forEach((el) => (el.textContent = u()[el.dataset.t]));

  const job = ofType("job")[0];
  $("name").textContent = PROFILE.name;
  $("role").innerHTML = `<b>${esc(T(PROFILE.role))}</b>${job ? ` — ${esc(T(job.org))}` : ""}`;
  const ICON = { email: "✉", GitHub: "◴", LinkedIn: "in" };
  $("contact").innerHTML = [
    `<a href="mailto:${esc(PROFILE.email)}"><span>${ICON.email}</span>${esc(PROFILE.email)}</a>`,
    ...PROFILE.socials.map((s) => `<a href="${esc(s.url)}" target="_blank" rel="noopener"><span>${ICON[s.label] || "↗"}</span>${esc(s.label)}</a>`),
  ].join("");
  $("summary").textContent = T(PROFILE.summary);

  $("exp").innerHTML = ofType("job").sort((a, b) => b.year - a.year).map((x) => entry(x)).join("");
  const ORDER = ["orbit", "reconsuite", "testlab", "xsslab", "site"], rank = (p) => (ORDER.includes(p.id) ? ORDER.indexOf(p.id) : 99);
  const projects = ofType("project").slice().sort((a, b) => rank(a) - rank(b) || b.year - a.year);
  $("proj").innerHTML = projects.map((p, i) => `
    <article class="proj${i === 0 ? " feat" : ""}">
      <span class="yr">${i === 0 ? u().feat + " · " : ""}${Math.floor(p.year)}</span>
      <h3>${esc(T(p.title))}</h3>
      ${p.with ? `<div class="with">${withHtml(p)}</div>` : ""}
      <p>${esc(T(p.desc))}</p>
      <div class="stack">${skillsOf(p).map((s) => `<span>${esc(T(s.title))}</span>`).join("")}</div>
      ${p.url ? extLink(rootUrl(p.url), p.id === "orbit" ? u().read : u().open, "more") : ""}
    </article>`).join("");
  $("edu").innerHTML = ofType("edu").map((x) => entry(x)).join("");

  const groups = {};
  ofType("skill").forEach((s) => (groups[s.group] = groups[s.group] || []).push(T(s.title)));
  $("skl").innerHTML = `<dl class="skills">
    ${Object.entries(groups).map(([g, list]) => `<dt>${esc(T(SKILL_GROUPS[g]))}</dt><dd>${list.map((t) => `<span class="chip">${esc(t)}</span>`).join("")}</dd>`).join("")}
    <dt>${u().langs}</dt><dd>${T(PROFILE.languages).split("·").map((l) => `<span class="chip">${esc(l.trim())}</span>`).join("")}</dd>
  </dl>`;

  renderPosts();
  $("evren-note").innerHTML = u().evren;
  $("print-btn").textContent = u().print;
}

$("lang-btn").onclick = () => { setLang(lang === "tr" ? "en" : "tr"); render(); };
$("print-btn").onclick = () => print();

render();
loadPosts().then((p) => { posts = p; renderPosts(); });
</script>
</body>
</html>
